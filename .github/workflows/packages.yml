# SPDX-License-Identifier: GPL-2.0-or-later
#
# Linux packages: the AppImage and the Flatpak bundle, each with the base
# pack, built and install-tested (installed, started with --measure under
# Xvfb, the base pack found and imagery drawn, uninstalled). Runs on
# changes to the packaging, nightly, by hand, and from the release
# workflow, which publishes the packages it uploads. See
# docs/release/packaging.md.

name: Packages

on:
  pull_request:
    paths:
      - packaging/**
      - app/app.pro
      - terrasoar.pro
      - .github/workflows/packages.yml
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with ci.yml.
  QT6_VERSION: "6.8.3"
  MESA_VERSION: "26.2.6"
  MESA_SHA256: "da0f71d9181b672c1918f3c342f11118c687f6059a46b16502845160733cc388"
  LINUX_DEPS: >-
    libgdal-dev libproj-dev libgeos-dev libsqlite3-dev libgeographiclib-dev
    libgl1-mesa-dev libgl1-mesa-dri libegl1 libxkbcommon-x11-0
    libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
    libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
    xvfb

jobs:
  basepack:
    name: Base pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT6_VERSION }}
          cache: true

      - name: Restore the pack's sources
        id: sources
        uses: actions/cache/restore@v6
        with:
          path: basepack-sources
          key: basepack-sources-${{ hashFiles('tools/packager/basepack.json') }}

      - name: Build the packager
        run: |
          mkdir build-ci && cd build-ci
          qmake -r ../terrasoar.pro CONFIG+=release
          make -j"$(nproc)" sub-tools

      - name: Build the base pack
        env:
          GH_TOKEN: ${{ github.token }}
          TS_BASEPACK_SOURCES: ${{ github.workspace }}/basepack-sources
        run: python3 tools/packager/build_basepack.py --build-dir build-ci

      - name: Upload the base pack
        uses: actions/upload-artifact@v7
        with:
          name: package-basepack
          retention-days: 7
          path: build-ci/basepack

  appimage:
    name: AppImage
    needs: basepack
    # The oldest Linux the AppImage runs on is the one it is built on
    # (glibc 2.39); GDAL 3.6 or later is needed (docs/release/packaging.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS \
            libfuse2t64 desktop-file-utils appstream

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT6_VERSION }}
          cache: true

      - name: Download the base pack
        uses: actions/download-artifact@v7
        with:
          name: package-basepack
          path: basepack

      - name: Check the desktop entry and AppStream metadata
        run: |
          desktop-file-validate packaging/linux/io.github.marutan.TerraSoar.desktop
          appstreamcli validate --no-net packaging/linux/io.github.marutan.TerraSoar.metainfo.xml

      - name: Build
        run: |
          mkdir build-ci && cd build-ci
          qmake ../terrasoar.pro CONFIG+=release CONFIG+=ts_app_only
          make -j"$(nproc)"

      - name: Build the AppImage
        run: >-
          python3 packaging/linux/build_appimage.py --build-dir build-ci
          --basepack basepack --output-dir dist --qmake "$(command -v qmake)"

      - name: Install test
        run: >-
          xvfb-run -a -s "-screen 0 1280x1024x24"
          python3 packaging/linux/test_package.py appimage dist/TerraSoar-*-x86_64.AppImage

      - name: Upload the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: package-appimage
          retention-days: 14
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256

  flatpak:
    name: Flatpak
    needs: basepack
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Download the base pack
        uses: actions/download-artifact@v7
        with:
          name: package-basepack
          path: basepack

      - name: Version
        id: version
        run: echo "version=$(sed -n 's/^TS_VERSION *= *//p' common.pri)" >> "$GITHUB_OUTPUT"

      - name: Build the Flatpak
        uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40 # master, 2025-04-24
        with:
          manifest-path: packaging/flatpak/io.github.marutan.TerraSoar.yml
          bundle: TerraSoar-${{ steps.version.outputs.version }}.flatpak
          upload-artifact: false
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}

      - name: Checksum
        run: |
          mkdir -p dist
          mv TerraSoar-*.flatpak dist/
          cd dist && for f in *.flatpak; do sha256sum "$f" > "$f.sha256"; done

      - name: Upload the Flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: package-flatpak
          retention-days: 14
          path: dist

  flatpak-install:
    name: Flatpak install test
    needs: flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak xvfb \
            libgl1-mesa-dri

      - name: Download the bundle
        uses: actions/download-artifact@v7
        with:
          name: package-flatpak
          path: dist

      - name: Install test
        run: >-
          xvfb-run -a -s "-screen 0 1280x1024x24"
          python3 packaging/linux/test_package.py flatpak dist/TerraSoar-*.flatpak

  windows:
    name: Windows installer
    needs: basepack
    runs-on: windows-2022
    env:
      VCPKG_TRIPLET: x64-windows
      VCPKG_INSTALLED: ${{ github.workspace }}\vcpkg_installed
      # Empty until the repository has a signing certificate; the signing
      # steps run only when it is set (a step's `if` sees the job's env).
      WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v7

      # The same libraries and cache as ci.yml's Windows jobs.
      - name: Restore third-party libraries
        id: deps-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg_installed
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-gdal-proj-geos-sqlite3-geographiclib-v1
          restore-keys: vcpkg-${{ env.VCPKG_TRIPLET }}-

      - name: Build third-party libraries
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            --triplet $env:VCPKG_TRIPLET `
            --x-install-root="$env:VCPKG_INSTALLED" `
            gdal proj geos sqlite3 geographiclib

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT6_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC environment
        uses: ./.github/actions/msvc-env

      - name: Install jom
        shell: pwsh
        run: choco install jom -y --no-progress

      - name: Build
        shell: cmd
        run: |
          mkdir build-ci && cd build-ci
          qmake ..\terrasoar.pro CONFIG+=release CONFIG+=ts_app_only ^
            DEPS_ROOT=%VCPKG_INSTALLED%\%VCPKG_TRIPLET%
          jom

      # The software OpenGL the installer ships as opengl32sw.dll, pinned
      # like ci.yml's.
      - name: Download Mesa llvmpipe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "mesa3d-$env:MESA_VERSION-release-mingw.7z"
          gh release download $env:MESA_VERSION -R pal1000/mesa-dist-win `
            -p $name -D $env:RUNNER_TEMP
          $archive = Join-Path $env:RUNNER_TEMP $name
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MESA_SHA256) {
            throw "SHA-256 of $name is $hash, expected $env:MESA_SHA256"
          }
          7z e -y "-o$env:RUNNER_TEMP\mesa" $archive x64/opengl32.dll x64/libgallium_wgl.dll
          if ($LASTEXITCODE -ne 0) { throw "7z failed" }

      - name: Download the base pack
        uses: actions/download-artifact@v7
        with:
          name: package-basepack
          path: basepack

      - name: Version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^TS_VERSION *= *//p' common.pri)" >> "$GITHUB_OUTPUT"

      # Signing switches on when the repository has a certificate
      # (docs/release/process.md#signing): a base64 PFX and its password.
      - name: Sign the program
        if: env.WINDOWS_SIGNING_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP signing.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
          signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f $pfx /p $env:WINDOWS_SIGNING_PASSWORD build-ci\app\terrasoar.exe
          Remove-Item $pfx

      - name: Stage the installation
        shell: cmd
        run: >-
          python packaging\windows\deploy.py
          --exe build-ci\app\terrasoar.exe --qt-bin %QT_ROOT_DIR%\bin
          --vcpkg %VCPKG_INSTALLED%\%VCPKG_TRIPLET% --mesa %RUNNER_TEMP%\mesa
          --basepack basepack --stage stage --uninstall-list uninstall.nsh

      - name: Build the installer
        shell: cmd
        run: |
          mkdir dist
          "C:\Program Files (x86)\NSIS\makensis.exe" /V3 ^
            /DVERSION=${{ steps.version.outputs.version }} ^
            /DSTAGE=%CD%\stage /DUNINSTALL_LIST=%CD%\uninstall.nsh ^
            /DOUTFILE=%CD%\dist\TerraSoar-${{ steps.version.outputs.version }}-setup.exe ^
            packaging\windows\terrasoar.nsi

      - name: Sign the installer
        if: env.WINDOWS_SIGNING_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP signing.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
          signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f $pfx /p $env:WINDOWS_SIGNING_PASSWORD (Get-ChildItem dist\*.exe).FullName
          Remove-Item $pfx

      - name: Install test
        shell: cmd
        run: >-
          python packaging\windows\test_installer.py
          dist\TerraSoar-${{ steps.version.outputs.version }}-setup.exe
          ${{ steps.version.outputs.version }}

      - name: Checksum
        shell: bash
        run: cd dist && for f in *.exe; do sha256sum "$f" > "$f.sha256"; done

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: package-windows
          retention-days: 14
          path: dist
