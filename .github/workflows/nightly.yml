# SPDX-License-Identifier: GPL-2.0-or-later
#
# Full suite: nightly, on release tags and on demand.
#   - everything in ci.yml (reused via workflow_call is not needed: the
#     fast jobs already run on every push to the tagged commit)
#   - performance and memory checks against the stored baselines, on Mesa
#     llvmpipe, plus an optional self-hosted run on the reference PC
#   - Doxygen API docs as an artefact
#   - full-tree static analysis (clang-tidy, clazy, cppcheck) and an MSVC
#     /analyze build, with the reports as artefacts
#   - on tags: source tarball published to GitHub Releases
#
# Golden-image, scripted-flight and install tests join this workflow in the
# phases that introduce them (see docs/testing.md).

name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      reference-pc:
        description: Also run on the self-hosted reference PC
        type: boolean
        default: false

env:
  QT6_VERSION: "6.8.3"
  LINUX_DEPS: >-
    libgdal-dev libproj-dev libgeos-dev libsqlite3-dev libgeographiclib-dev
    libgl1-mesa-dev libgl1-mesa-dri libegl1 libxkbcommon-x11-0
    libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
    libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
    xvfb

jobs:
  performance:
    name: Performance (Mesa llvmpipe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        # Plain apt-get, not an apt-cache action: those restore files without
        # running maintainer scripts, which leaves libblas.so.3/liblapack.so.3
        # (Debian alternatives) missing and GDAL's dependencies unlinkable.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT6_VERSION }}
          cache: true

      - name: Build
        run: |
          mkdir build-perf && cd build-perf
          qmake ../terrasoar.pro CONFIG+=release
          make -j"$(nproc)"

      - name: Benchmarks
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p perf-results
          for t in build-perf/tests/*/tst_*; do
            [ -x "$t" ] || continue
            "$t" -o "perf-results/$(basename "$t").xml,xml" \
                 -o -,txt -minimumvalue 10
          done

      - name: Start-up, memory and idle CPU
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            python3 tools/perf/measure_startup.py build-perf/app/terrasoar \
              --platform xcb --runs 5 --idle-seconds 10 \
              --baseline tools/perf/baselines/ci-linux-llvmpipe.json \
              --output perf-results/startup.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-results
          path: perf-results

  reference-pc:
    name: Performance (reference PC)
    if: github.event_name == 'workflow_dispatch' && inputs.reference-pc
    runs-on: [self-hosted, reference-pc]
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          mkdir -p build-ref && cd build-ref
          qmake ../terrasoar.pro CONFIG+=release
          make -j3
      - name: Start-up, memory and idle CPU
        run: |
          python3 tools/perf/measure_startup.py build-ref/app/terrasoar \
            --platform xcb --runs 5 --idle-seconds 10 \
            --baseline tools/perf/baselines/reference-pc.json

  docs:
    name: API documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz
      - name: Build docs
        run: python3 tools/checks/check_doxygen.py
      - uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: build/docs/api

  analysis:
    name: Static analysis (full tree)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS \
            clang-tidy-18 clazy cppcheck

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT6_VERSION }}
          cache: true

      - name: Analyse
        env:
          QMAKE: qmake
        run: |
          export CLAZY_RESOURCE_DIR="$(clang-15 -print-resource-dir)"
          python3 tools/checks/run_static_analysis.py --build-dir build-analyze \
            --self-test
          python3 tools/checks/run_static_analysis.py --build-dir build-analyze \
            --no-build --report-dir analysis-report

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: static-analysis-report
          path: analysis-report
          if-no-files-found: ignore

  msvc-analyze:
    name: MSVC /analyze (Windows / Qt 6)
    runs-on: windows-2022
    env:
      VCPKG_TRIPLET: x64-windows
      VCPKG_INSTALLED: ${{ github.workspace }}\vcpkg_installed
    steps:
      - uses: actions/checkout@v7

      # Same third-party libraries and cache key as ci.yml.
      - name: Restore third-party libraries
        id: deps-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg_installed
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-gdal-proj-geos-sqlite3-geographiclib-v1
          # A cache for an earlier library list is a good start: vcpkg then
          # only builds what is missing (minutes, not the full hour).
          restore-keys: vcpkg-${{ env.VCPKG_TRIPLET }}-

      - name: Build third-party libraries
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            --triplet $env:VCPKG_TRIPLET `
            --x-install-root="$env:VCPKG_INSTALLED" `
            gdal proj geos sqlite3 geographiclib

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT6_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC environment
        uses: ./.github/actions/msvc-env

      - name: Install jom
        shell: pwsh
        run: choco install jom -y --no-progress

      - name: Build with /analyze
        # Analysis warnings in our own code are errors (CONFIG+=werror).
        shell: cmd
        run: |
          mkdir build-analyze && cd build-analyze
          qmake ..\terrasoar.pro CONFIG+=werror CONFIG+=release ^
            CONFIG+=msvc_analyze DEPS_ROOT=%VCPKG_INSTALLED%\%VCPKG_TRIPLET%
          jom > ..\msvc-analyze.log 2>&1
          set RESULT=%ERRORLEVEL%
          type ..\msvc-analyze.log
          exit /b %RESULT%

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: msvc-analyze-log
          path: msvc-analyze.log
          if-no-files-found: ignore

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [performance, docs, analysis, msvc-analyze]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Source tarball
        run: |
          NAME="terrasoar-${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="$NAME/" \
            -o "$NAME.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            terrasoar-*.tar.gz terrasoar-*.tar.gz.sha256
